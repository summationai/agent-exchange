name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: amd64
          - runner: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Install static Linux toolchain
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build standalone binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          mkdir -p dist/package
          if [ "$PLATFORM" = linux ]; then
            CC=musl-gcc CGO_ENABLED=1 go build -trimpath -tags sqlite_omit_load_extension -ldflags '-s -w -linkmode external -extldflags -static' -o dist/package/ax ./cmd/ax
            file dist/package/ax | grep 'statically linked'
          else
            go build -trimpath -ldflags '-s -w' -o dist/package/ax ./cmd/ax
          fi
          dist/package/ax version
      - name: Package and smoke test
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          cp LICENSE dist/package/
          tar -czf "dist/ax_${PLATFORM}_${ARCH}.tar.gz" -C dist/package ax LICENSE
          python3 scripts/test_install.py
      - uses: actions/upload-artifact@v7
        with:
          name: ax-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  wsl:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ax-linux-amd64
          path: dist
      - name: Verify installer and broker in WSL 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://cloud-images.ubuntu.com/wsl/releases/24.04/current'
          $image = 'ubuntu-noble-wsl-amd64-wsl.rootfs.tar.gz'
          Invoke-WebRequest "$base/$image" -OutFile "$env:RUNNER_TEMP/$image"
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile "$env:RUNNER_TEMP/SHA256SUMS"
          $sums = Get-Content "$env:RUNNER_TEMP/SHA256SUMS" -Raw
          $expected = (($sums -split "`n" | Where-Object { $_.Trim().EndsWith($image) }) -split '\s+')[0]
          $actual = (Get-FileHash "$env:RUNNER_TEMP/$image" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw 'WSL image checksum mismatch' }
          wsl --import AXTest "$env:RUNNER_TEMP/ax-wsl" "$env:RUNNER_TEMP/$image" --version 2
          if ($LASTEXITCODE -ne 0) { throw 'WSL 2 import failed' }
          git archive -o source.tar HEAD
          $source = (wsl -d AXTest -u root --exec wslpath -a -u "$env:GITHUB_WORKSPACE").Trim()
          $script = @'
          set -eu
          uname -r
          apt-get update -qq
          apt-get install -y python3
          mkdir -p /root/ax-check/dist/package
          tar -xf "$1/source.tar" -C /root/ax-check
          tar -xzf "$1/dist/ax_linux_amd64.tar.gz" -C /root/ax-check/dist/package
          cd /root/ax-check
          python3 scripts/test_install.py
          '@
          wsl -d AXTest -u root --exec bash -c $script.Replace("`r", '') ax "$source"
          if ($LASTEXITCODE -ne 0) { throw 'WSL installer verification failed' }
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wsl]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^var Version = "\([^"]*\)".*/\1/p' internal/ax/launcher.go)
          test "$RELEASE_TAG" = "v$version"
          cp install.sh LICENSE dist/
          cd dist
          sha256sum ax_*.tar.gz install.sh LICENSE > checksums.txt
          gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "Agent Exchange $RELEASE_TAG" --notes-file ../claude.rc/release-notes.md ./*
